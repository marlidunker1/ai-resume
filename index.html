<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marli Dunker — AI Resume</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 640px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 620px;
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
      background: #fafafa;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #EEEDFE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #3C3489;
      flex-shrink: 0;
    }
    .header-text {
      flex: 1;
      min-width: 0;
    }
    .header-text .name {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .header-text .sub {
      font-size: 12px;
      color: #888;
      margin-top: 1px;
    }
    .resume-download-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      color: #3C3489;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .resume-download-btn:hover {
      background: #EEEDFE;
      border-color: #3C3489;
    }
    .resume-download-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .msg.user {
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-avatar.ai { background: #EEEDFE; color: #3C3489; }
    .msg-avatar.user { background: #f0f0f0; color: #555; }
    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      color: #1a1a1a;
    }
    .bubble.ai {
      background: #f5f5f7;
      border-radius: 4px 14px 14px 14px;
    }
    .bubble.user {
      background: #EEEDFE;
      color: #26215C;
      border-radius: 14px 4px 14px 14px;
    }
    .typing-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #aaa;
      border-radius: 50%;
      animation: blink 1.2s infinite;
      margin-right: 2px;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; margin-right: 0; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 20px 0;
    }
    .chip {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #e0e0e0;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .chip:hover {
      background: #f5f5f7;
      color: #1a1a1a;
      border-color: #ccc;
    }
    .input-row {
      display: flex;
      gap: 8px;
      padding: 12px 20px 16px;
      border-top: 1px solid #f0f0f0;
    }
    .input-row input {
      flex: 1;
      font-size: 14px;
      padding: 9px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      font-family: inherit;
      color: #1a1a1a;
      background: #fff;
      transition: border-color 0.15s;
    }
    .input-row input:focus {
      border-color: #3C3489;
    }
    .input-row input::placeholder { color: #aaa; }
    .input-row button {
      padding: 9px 18px;
      background: #3C3489;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .input-row button:hover { background: #2e2768; }
    .input-row button:disabled { background: #aaa; cursor: not-allowed; }

    @media (max-width: 480px) {
      .resume-download-btn span.btn-label { display: none; }
      .resume-download-btn { padding: 8px; }
    }
  </style>
</head>
<body>

      <button class="chip" onclick="askChip(this)">How did you build this AI resume?</button>
      <button class="chip" onclick="askChip(this)">What do you think of Marli?</button>
    </div>

    <div class="input-row">
      <input type="text" id="user-input" placeholder="Ask anything..." />
      <button id="send-btn" onclick="send()">Send</button>
    </div>
  </div>
